<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>HitMap pilotage</title>
  <style>
    /* L'iframe Twitch est transparente : sans fond explicite, texte noir sur fond sombre. */
    body {
      font: 13px sans-serif;
      margin: 10px;
      background: #fff;
      color: #000;
    }

    button {
      margin: 6px 4px 0 0;
    }

    #error {
      color: #c0392b;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <strong>Collecte :</strong> <span id="status">...</span>
  <div>
    <button id="start">Demarrer</button>
    <button id="stop">Arreter</button>
    <button id="round">Nouvelle manche</button>
  </div>
  <div id="error"></div>

  <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
  <script src="config.js"></script>
  <script src="control.js"></script>
  <script src="live_config.js"></script>
</body>
</html>
