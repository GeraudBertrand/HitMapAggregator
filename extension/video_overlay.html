<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>HitMap viewer</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }

    #surface {
      position: fixed;
      inset: 0;
      cursor: crosshair;
    }

    #marker {
      position: fixed;
      width: 14px;
      height: 14px;
      margin: -7px 0 0 -7px;
      border: 2px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 3px #000;
      pointer-events: none;
      display: none;
    }

    #notice {
      position: fixed;
      left: 50%;
      bottom: 12%;
      transform: translateX(-50%);
      font: 13px sans-serif;
      color: #fff;
      background: rgba(0, 0, 0, .7);
      padding: 4px 10px;
      border-radius: 3px;
      pointer-events: none;
      display: none;
    }
  </style>
</head>
<body>
  <div id="surface"></div>
  <div id="marker"></div>
  <div id="notice"></div>
  <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
  <script src="config.js"></script>
  <script src="video_overlay.js"></script>
</body>
</html>
