<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HitMap configuration</title>
  <style>
    :root {
      --text: #18181b;
      --muted: #53535f;
      --line: #dedee3;
      --surface: #f7f7f8;
      --accent: #9147ff;
      --danger: #c0392b;
    }

    /* L'iframe Twitch est transparente : sans fond explicite, texte noir sur modal sombre. */
    body {
      margin: 0;
      padding: 16px;
      background: #fff;
      color: var(--text);
      font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    section {
      max-width: 640px;
      margin-bottom: 16px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    h2 {
      margin: 0 0 4px;
      font-size: 16px;
    }

    .hint {
      margin: 0 0 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .warning {
      color: var(--danger);
      font-weight: 600;
    }

    #overlay-url {
      width: 100%;
      box-sizing: border-box;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      font: 13px ui-monospace, Consolas, monospace;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    button {
      padding: 6px 14px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover {
      border-color: var(--accent);
    }

    #rotate {
      color: var(--danger);
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 0;
      border-top: 1px solid var(--line);
    }

    .row:first-of-type {
      border-top: 0;
    }

    .row small {
      display: block;
      color: var(--muted);
      font-size: 13px;
    }

    select {
      padding: 6px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--text);
      font: inherit;
    }

    .switch {
      appearance: none;
      flex: none;
      position: relative;
      width: 40px;
      height: 22px;
      margin: 0;
      border-radius: 11px;
      background: #b9b9c1;
      cursor: pointer;
      transition: background 0.15s;
    }

    .switch::before {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      transition: transform 0.15s;
    }

    .switch:checked {
      background: var(--accent);
    }

    .switch:checked::before {
      transform: translateX(18px);
    }

    button:focus-visible,
    select:focus-visible,
    .switch:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }

    #error {
      max-width: 640px;
      padding: 10px 12px;
      border-radius: 6px;
      background: #fdecea;
      color: var(--danger);
    }

    #error:empty {
      display: none;
    }
  </style>
</head>
<body>
  <section>
    <h2>URL de la browser source OBS</h2>
    <p class="hint">
      <span class="warning">Secrète : ne l'affichez jamais à l'écran.</span>
      À coller dans OBS : Sources, +, Navigateur, URL. Largeur et hauteur = celles de la scène.
    </p>
    <input id="overlay-url" type="password" readonly aria-label="URL de l'overlay OBS">
    <div class="actions">
      <button id="show">Afficher</button>
      <button id="copy">Copier</button>
      <button id="rotate">Régénérer</button>
    </div>
  </section>

  <section id="settings">
    <h2>Réglages</h2>
    <p class="hint">Appliqués immédiatement, y compris pendant un live.</p>

    <label class="row">
      <span>Rendu<small>Ce que l'overlay dessine sur le stream.</small></span>
      <select id="renderMode">
        <option value="Both">Ellipses + densité</option>
        <option value="Ellipse">Ellipses</option>
        <option value="Contour">Densité</option>
      </select>
    </label>

    <label class="row">
      <span>Overlay visible<small>Masque la carte sans arrêter la collecte.</small></span>
      <input type="checkbox" role="switch" class="switch" id="visible">
    </label>

    <label class="row">
      <span>Compter les viewers non connectés<small>Réversible : leurs clics sont gardés dans tous les cas.</small></span>
      <input type="checkbox" role="switch" class="switch" id="allowAnonymous">
    </label>
  </section>

  <div id="error" role="alert"></div>

  <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
  <script src="config.js"></script>
  <script src="control.js"></script>
  <script src="config_page.js"></script>
</body>
</html>
